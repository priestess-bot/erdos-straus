name: T6 Gate 0 and research knowledge base

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t6-gate0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the exact revision
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run the complete Gate 0 matrix
        run: >-
          python scripts/t6_ci_run_manifest_v1.py run
          --root .
          --output data/t6-wave1/ci-run-manifest-v1.json
          --require-github

      - name: Verify the HEAD-bound run manifest
        if: always()
        run: >-
          python scripts/t6_ci_run_manifest_v1.py verify
          --root .
          --manifest data/t6-wave1/ci-run-manifest-v1.json
          --require-github

      - name: Upload the Gate 0 run manifest
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t6-gate0-${{ github.sha }}-${{ github.run_id }}
          path: data/t6-wave1/ci-run-manifest-v1.json
          if-no-files-found: error
          retention-days: 30
