schema_version: 1
cutoff_date: 2026-07-23
scope: >-
  Direct studies of 4/n = 1/x + 1/y + 1/z, origin documents, computational
  records, and papers needed to interpret a direct result. A record here is a
  screening decision, not an endorsement of its mathematics.

disposition_values:
  included: paper card required
  merge_version: represented by another paper card
  background: concept or bibliography pointer only
  queued: metadata found; full screening unfinished
  excluded: outside the direct corpus or no substantive research result

