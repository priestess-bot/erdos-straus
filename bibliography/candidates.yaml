version_policy:
  - "One paper card represents an intellectual work; version history is stored on that card."
  - "A journal version supersedes an arXiv version for publication status, while the open arXiv source remains linked."
  - "Zenodo concept DOI and version DOI are not counted as two papers."
  - "A proof claim stays in the corpus even when flawed, because its failure mode is research-relevant."
